[package]
name = "gterminal"
version = "0.2.0"
description = "A lightweight terminal for Windows"
authors = ["Gus Catalano"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "gterminal_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.9"
tauri-plugin-dialog = "2.7.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_System_Diagnostics_ToolHelp",
  # status-bar counters: PDH, power, memory/CPU/uptime, disk free space
  "Win32_System_Performance",
  "Win32_System_Power",
  "Win32_System_SystemInformation",
  "Win32_Storage_FileSystem",
  "Win32_System_Registry",
  "Win32_UI_WindowsAndMessaging",
] }

# Keep dev builds responsive: the per-keystroke path (IPC, JSON, TCP, PTY)
# is far too slow at opt-level 0.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2


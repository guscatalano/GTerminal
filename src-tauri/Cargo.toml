[package]
name = "gterminal"
# Not the version anyone sees. What ships is tauri.conf.json's version,
# which build.rs reads and exposes as GTERMINAL_VERSION - use that.
# These were out of step for months, and the code reported this one.
version = "0.2.0"
description = "A lightweight terminal for Windows"
authors = ["Gus Catalano"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "gterminal_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon", "image-png"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.9"
tauri-plugin-dialog = "2.7.2"
tauri-plugin-global-shortcut = "2.3.2"
tauri-plugin-clipboard-manager = "2.3.2"
tauri-plugin-single-instance = "2.4.3"
# The updater talks to the project's GitHub releases and downloads an
# MSI. Blocking client on a worker thread: the whole interaction is
# "fetch a list" and "fetch a file", and an async stack would be a lot
# of machinery for two requests. rustls rather than schannel so the
# trust store is the same one the tests run against.
ureq = { version = "2", default-features = false, features = ["tls", "json", "gzip"] }
# Remote control speaks HTTPS by default, with a self-signed certificate
# it generates once and keeps. rustls (the ring backend, the same one
# ureq already links, so there is one crypto library in the build) is the
# server; rcgen makes the certificate; rustls-pemfile reads it back off
# disk on the next launch so the cert a phone trusted once stays put.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "logging", "tls12"] }
rcgen = { version = "0.13", default-features = false, features = ["pem", "ring"] }
rustls-pemfile = "2"
# Already in the tree transitively (tauri and windows both pull it in);
# depended on directly here just to convert Claude Code's UTC transcript
# timestamps into "today" in whatever timezone this machine is set to.
chrono = "0.4"
tauri-plugin-notification = "2"

[target.'cfg(windows)'.dependencies]
# Reaching WebView2's own settings, to turn Edge's accelerator keys off.
# Pinned to what wry already links, so there is only one WebView2 binding
# in the build.
webview2-com = "0.38"
windows = { version = "0.61", features = [
  "Win32_Foundation",
  # SMTC — the system "now playing": whatever is playing (Spotify, a
  # browser tab, any media app) read locally through Windows' own media
  # controls, so there is no Spotify login and nothing leaves the machine.
  # Media_Control for the session + track, Storage_Streams to read the
  # album-art thumbnail, Foundation for awaiting the async calls, and
  # System_Com to put the worker thread in an apartment WinRT will talk to.
  "Media_Control",
  "Storage_Streams",
  "Foundation",
  "Win32_System_Com",
] }
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_System_Diagnostics_ToolHelp",
  # status-bar counters: PDH, power, memory/CPU/uptime, disk free space
  "Win32_System_Performance",
  "Win32_System_Power",
  "Win32_System_SystemInformation",
  # thread priority for the keystroke path (mux::raise_thread_priority)
  "Win32_System_Threading",
  # BCryptGenRandom, for the remote-control token. The whole security
  # of that feature is one random string, so it comes from the OS
  # generator rather than from anything this process could be talked
  # into predicting.
  "Win32_Security_Cryptography",
  "Win32_Storage_FileSystem",
  # package identity, to find where %LOCALAPPDATA% writes really land
  "Win32_Storage_Packaging_Appx",
  "Win32_System_Registry",
  "Win32_UI_WindowsAndMessaging",
  # ShellExecuteW, to ask Windows for an elevated window
  "Win32_UI_Shell",
] }

# Keep dev builds responsive: the per-keystroke path (IPC, JSON, TCP, PTY)
# is far too slow at opt-level 0.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2


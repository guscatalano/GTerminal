name: Dev build

# An installable build of main, without the Store.
#
# The Store round trip is submission, certification and a wait measured in
# hours - right for a release, wrong for finding out whether a fix works on
# a real machine. This publishes an MSI on every push to main, as a
# pre-release the app can list and install from.
#
# Two things make it safe to run alongside the installed app:
#
#   - It is built with GTERMINAL_CHANNEL=dev, so its daemon, sessions,
#     config and history live in %LOCALAPPDATA%\GTerminal-dev. A test build
#     sharing the ordinary folder would share the daemon holding real
#     sessions, which has already happened here once: a side-by-side
#     package attached to the running daemon and took a session out of a
#     window that was in use.
#   - It is marked pre-release, so nothing about the Store listing or the
#     release line changes.
#
# Versioning: Windows Installer ignores the fourth version field when
# deciding whether one MSI upgrades another, so the patch has to move for
# an update to install at all. Dev builds therefore run in a 1000+ patch
# series - 0.12.1042 rather than 0.12.10 - which is always above the
# release line and is visibly not a release. Going back to a real release
# from a dev build is a deliberate choice in the version list, and pinning
# is what stops the next dev build taking it away again.

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'src-tauri/**'
      - 'index.html'
      - 'package.json'
      - 'vite.config.ts'
      - '.github/workflows/dev-build.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dev-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      # The E2E suites drive this binary rather than a mock, so it has to
      # exist before they run - without it typing.ps1 stops at "build
      # first: cargo build in src-tauri", which is what this workflow did
      # on its first outing.
      #
      # Deliberately without GTERMINAL_CHANNEL: the suites expect the
      # ordinary state directory, and build.rs re-runs when that variable
      # changes, so the channel build below is a separate compile.
      - name: Build daemon (debug, used by E2E suites)
        run: cargo build --manifest-path src-tauri/Cargo.toml

      # Cheap, and it is the whole suite that does not need a screen. A dev
      # build people install on a real machine should not be worse tested
      # than one that goes to the Store.
      - name: Every suite that does not need a screen
        run: npm test

      - name: Version this build
        id: ver
        shell: pwsh
        run: |
          $conf = Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          $parts = $conf.version.Split('.')
          # 1000 + the run number: always above the release line, always
          # increasing, and obviously not a release at a glance.
          $dev = "$($parts[0]).$($parts[1]).$(1000 + [int]'${{ github.run_number }}')"
          Write-Host "release version $($conf.version) -> dev version $dev"

          # Patterns and replacements in variables, never built inline in
          # the -replace. PowerShell binds + tighter than the comma, so
          #   $raw -replace 'a' + $x + '"', $replacement
          # parses as 'a' + $x + ('"', $replacement) - string plus array,
          # joined into ONE string - and -replace then gets a single
          # argument: a pattern matching nothing and no replacement. It
          # changes nothing and reports success, which is how the first dev
          # release went out tagged 0.12.1002 carrying an 0.12.10 installer.
          function Set-Version($path, $from, $to) {
            $raw = Get-Content $path -Raw
            $pattern = '"version": "' + [regex]::Escape($from) + '"'
            $replacement = '"version": "' + $to + '"'
            $out = $raw -replace $pattern, $replacement
            if ($out -eq $raw) { throw "version rewrite matched nothing in $path (looked for $from)" }
            Set-Content $path -Value $out -NoNewline
            # Read it back. The whole failure above was a step that did
            # nothing and said it worked.
            $now = (Get-Content $path -Raw | ConvertFrom-Json).version
            if ($now -ne $to) { throw "$path still says $now after the rewrite" }
            Write-Host "  $path -> $now"
          }
          Set-Version 'src-tauri/tauri.conf.json' $conf.version $dev
          $pkg = (Get-Content package.json -Raw | ConvertFrom-Json).version
          Set-Version 'package.json' $pkg $dev
          "version=$dev" >> $env:GITHUB_OUTPUT

      - name: Build the installer
        env:
          # The whole point: its own state directory, so it cannot touch
          # the sessions of the app already installed on the machine.
          GTERMINAL_CHANNEL: dev
        run: npx tauri build --bundles msi

      - name: Publish the dev release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $v = '${{ steps.ver.outputs.version }}'
          $msi = Get-ChildItem src-tauri/target/release/bundle/msi/*.msi | Select-Object -First 1
          if (-not $msi) { throw "no MSI was built" }
          # The tag and the installer must agree. They did not once: a tag
          # of 0.12.1002 carrying an 0.12.10 installer, which the updater
          # would offer for ever and never appear to install, because the
          # version it ends up running is not the one it just fetched.
          if ($msi.Name -notlike "*$v*") {
            throw "the tag says $v but the installer is $($msi.Name) - the version rewrite did not reach the build"
          }
          $notes = @"
          Dev build of ``main`` at ${{ github.sha }}.

          Its own state directory (``%LOCALAPPDATA%\GTerminal-dev``), so it runs
          alongside an installed GTerminal without touching its sessions.

          Not a release. Settings -> Updates lists every version and installs
          any of them, so going back is a click.
          "@
          gh release create "v$v" $msi.FullName `
            --title "v$v (dev)" `
            --notes "$notes" `
            --prerelease

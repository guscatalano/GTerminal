# CI: every push/PR runs the full test suite (frontend typecheck, theme
# contrast audit, daemon lifecycle + typing E2E against an isolated
# daemon). Tags matching v* additionally build the MSI, NSIS, and signed
# MSIX installers and publish them as a GitHub release — gated on tests.
name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Typecheck frontend
        run: npx tsc --noEmit

      - name: Theme contrast audit
        run: node tests/contrast.mjs

      - name: Build daemon (debug, used by E2E suites)
        run: cargo build --manifest-path src-tauri/Cargo.toml

      - name: Lifecycle E2E suite
        run: pwsh -NoProfile -File tests/lifecycle.ps1

      - name: Typing correctness + latency suite
        run: pwsh -NoProfile -File tests/typing.ps1

  # What the tests actually reach, in both languages, published to the run's
  # summary page.
  #
  # Its own job rather than a step on `test`: nothing should wait on a
  # number to find out whether the code works.
  #
  # Deliberately no threshold. The honest figures here are per-area and a
  # single gate over them would be gameable in the worst direction: the
  # quickest way to raise a combined number is to write shallow unit tests
  # for code that is already covered end to end by suites this tool cannot
  # see. See tests/coverage-report.mjs for what is and is not measured.
  coverage:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          # The instrumented build is not the one the other jobs want back.
          key: coverage

      - uses: taiki-e/install-action@cargo-llvm-cov

      - name: Install frontend dependencies
        run: npm ci

      - name: Measure
        run: npm run coverage

      # The tables land in the job summary on their own; these are the
      # browsable versions for when a number is not enough.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: |
            coverage/ts/**
            coverage/rust/**
          if-no-files-found: warn

  release:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Build MSI + NSIS bundles
        run: npx tauri build --bundles msi,nsis

      - name: Package signed MSIX
        run: pwsh -NoProfile -File tools/make-msix.ps1

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          generate_release_notes: true
          files: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*-setup.exe
            src-tauri/target/release/bundle/msix/*.msix
            src-tauri/target/release/bundle/msix/GTerminal-signing.cer

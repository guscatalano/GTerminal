name: Store publish

# Publishes the app + store/listing.*.json to the Microsoft Store (product
# 9PBXQ1K155G7) on every v* tag, via the shared guscatalano/store-publish
# pipeline. The package is built with make-msix.ps1 -ForStore: Partner Center
# publisher identity, UNSIGNED (the Store signs on ingestion).
#
# The MSIX version comes from tauri.conf.json, so a tag must ship a matching
# version bump (guarded below). A manual "Run workflow" re-submits the current
# tauri.conf.json version and is rejected by the Store if already used.
#
# NOTE: the FIRST submission for this product must be completed once in
# Partner Center (age rating, pricing, privacy URL, screenshots) before this
# pipeline can publish updates.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

# The Store holds one pending submission per product, so two tags minutes
# apart are not two releases - they are two runs fighting over one slot,
# and the loser fails an hour in with nothing to show for it. Newest wins:
# a later tag cancels whatever is still queued behind it.
concurrency:
  group: store-publish
  cancel-in-progress: true

jobs:
  # Nothing was stopping a broken build reaching the Store. The GitHub
  # release is gated on the test job in ci.yml, but this pipeline had no
  # tests in it at all and no dependency on that one - so on v0.7.0 the
  # test job failed and the Store publish succeeded anyway, from the same
  # tag, minutes apart.
  tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Typecheck frontend
        run: npx tsc --noEmit

      - name: Build daemon (debug, used by E2E suites)
        run: cargo build --manifest-path src-tauri/Cargo.toml

      - name: Every suite that does not need a screen
        run: npm test

  # And the ones that do. A release that ships a window which cannot
  # redraw is exactly what went out in 0.7.0 and 0.8.0, and the scenes
  # are the only thing that would have caught it.
  visual:
    uses: ./.github/workflows/visual.yml

  package:
    needs: [tests, visual]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Verify tag matches tauri.conf.json version
        if: github.ref_type == 'tag'
        shell: pwsh
        run: |
          $conf = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $tag = '${{ github.ref_name }}'.TrimStart('v')
          if ($conf -ne $tag) {
            throw "Tag v$tag != tauri.conf.json version $conf - bump the conf version before tagging (the Store rejects reused versions)."
          }

      - name: Install frontend dependencies
        run: npm ci

      - name: Build release exe (no installer bundles)
        run: npx tauri build --no-bundle

      - name: Package Store MSIX (unsigned)
        run: pwsh -NoProfile -File tools/make-msix.ps1 -ForStore

      - uses: actions/upload-artifact@v7
        with:
          name: store-package
          path: src-tauri/target/release/bundle/msix/*_store.msix
          if-no-files-found: error

  publish:
    needs: package
    uses: guscatalano/store-publish/.github/workflows/publish.yml@main
    with:
      product-id: 9PBXQ1K155G7
      package-artifact: store-package
      # Newest tag wins. Releases here come in bursts - fix, tag, fix, tag -
      # and the Store's one submission slot means a version tagged while the
      # last one is still certifying could not be submitted at all: 0.12.4
      # published nothing, and 0.12.9 went on top of a still-certifying
      # 0.12.8. The newest build is always the one that should go out, so a
      # later tag now clears the slot rather than failing against it.
      supersede-pending: true
    secrets: inherit

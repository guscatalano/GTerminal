name: Visual

# The scenes drive a real window: they take the foreground, type into it,
# click menus by coordinate and photograph the result. That is unpleasant
# to run on the machine you are working at - it types into whatever you
# have open - so it belongs on a runner instead.
#
# Not on every push: it takes twenty minutes and it is the only suite
# here that depends on a window appearing and a shell starting. Nightly,
# on demand, and called by the release pipeline - which will not publish
# without it, so a tag runs it exactly once.

on:
  workflow_dispatch:
    inputs:
      scene:
        description: 'Run only this scene (blank = all of them). A new scene is worth five minutes here rather than forty.'
        required: false
        type: string
        default: ''
  # Called by the release pipeline, which will not publish without it.
  workflow_call:
  schedule:
    - cron: "0 7 * * *"

permissions:
  contents: read

jobs:
  visual:
    runs-on: windows-latest
    # Measured, not guessed: the last six full runs took 22, 22, 28, 30, 33
    # and 37 minutes, and the nightly before this was killed at exactly 40 -
    # reported as "cancelled", which reads like someone stopped it rather
    # than like the suite running out of room. Scenes only get added, so the
    # ceiling has to sit well above the slowest run rather than beside it.
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      # A binary with the UI embedded. A plain `cargo build` points the
      # window at the vite dev server, which is not running here, and
      # every scene would fail against a blank window.
      # A real agent TUI to point the copilot scene at. Not fatal if the
      # registry is having a bad day: the scene skips itself when the
      # binary is absent, and says so. The runner is not signed in, so
      # that scene asserts only what holds without an account.
      - name: Install GitHub Copilot CLI
        continue-on-error: true
        run: npm install -g @github/copilot

      - name: Build the app (UI embedded)
        run: npx tauri build --debug --no-bundle

      # The runner starts at 1024x768 and the scenes size their window to
      # 1280x800, with menu coordinates measured at that size. A window
      # bigger than the screen gets clipped, and the clicks land nowhere.
      - name: Give the runner a screen the window fits on
        shell: pwsh
        run: |
          Set-DisplayResolution -Width 1920 -Height 1080 -Force
          Add-Type -AssemblyName System.Windows.Forms
          "screen: $([System.Windows.Forms.Screen]::PrimaryScreen.Bounds)"

      # -Force because nobody is at this keyboard: the idle check exists
      # to protect a person, and there is not one here.
      - name: Visual scenes
        shell: pwsh
        run: |
          # github.event.inputs, not inputs: this workflow is also called by
          # the release pipeline, where a dispatch input does not exist.
          $scene = '${{ github.event.inputs.scene }}'
          $base = @('run', 'test:visual', '--', '-Yes', '-Force', '-Exe', 'src-tauri/target/debug/gterminal.exe')
          $a = if ($scene) { $base + @('-Only', $scene) } else { $base }
          $failedFile = Join-Path $env:TEMP 'gt-visual-failed.txt'
          Remove-Item $failedFile -Force -ErrorAction SilentlyContinue
          Write-Host "npm $($a -join ' ')"
          & npm @a
          if ($LASTEXITCODE -eq 0) { exit 0 }
          # A single-scene dispatch is already a targeted run - nothing to retry.
          if ($scene) { throw "visual scene '$scene' failed" }
          # The full suite failed. On a busy or degraded runner, scenes tip over
          # their timeouts together and fail wholesale even when the app is
          # fine, while a real regression fails deterministically. So retry only
          # the scenes it named, once each, on a fresh app: a runner hiccup
          # passes the second time, a break fails both. visual.ps1 wrote the list.
          if (-not (Test-Path $failedFile)) {
            throw "visual scenes failed and named no scene to retry"
          }
          $failed = @(Get-Content $failedFile | Where-Object { $_ })
          # An unattributed failure (before any scene) - retry the whole suite.
          if ($failed -contains '__all__') {
            Write-Host "::warning::visual: an unattributed failure; retrying the whole suite once"
            & npm @a
            if ($LASTEXITCODE -ne 0) { throw "visual scenes failed on a full retry" }
            exit 0
          }
          Write-Host "::warning::visual: retrying $($failed.Count) scene(s): $($failed -join ', ')"
          $stillBad = @()
          foreach ($s in $failed) {
            Write-Host "---- retry: $s ----"
            & npm ($base + @('-Only', $s))
            if ($LASTEXITCODE -ne 0) { $stillBad += $s }
          }
          if ($stillBad.Count) { throw "visual scenes failed on retry: $($stillBad -join ', ')" }
          Write-Host "all $($failed.Count) retried scene(s) passed on a second attempt"

      # The videos and any saved frames are the point when something
      # fails: a scene that says "frame 2 looks like frame 1" is far
      # easier to judge with the pictures in front of you.
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: visual-recordings
          path: |
            docs/visual/*.avi
            docs/visual/*.gif
            # Stills a scene kept because it could not explain a failure in
            # words. Small, and only present when something went wrong.
            docs/visual/**/*.png
            docs/visual/*-frames/*.png
          if-no-files-found: warn

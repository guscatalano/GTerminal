<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GTerminal</title>
  </head>
  <body>
    <div id="app">
      <div id="sidebar">
        <div id="sidebar-title" data-tauri-drag-region>Sessions</div>
        <div id="sidebar-list"></div>
        <div id="sidebar-legend">● open&ensp;◌ hidden&ensp;○ detached&ensp;⌛ closing</div>
        <button id="sidebar-new">+ new session</button>
      </div>
      <div id="main">
        <div id="tabbar-row" data-tauri-drag-region>
          <button id="sidebtn" title="Toggle session sidebar (Ctrl+Shift+B)">☰</button>
          <div id="tabbar" data-tauri-drag-region></div>
          <button id="overflow" class="chip" hidden></button>
          <div id="hiddenbar"></div>
          <button id="newtab" title="New tab (Ctrl+Shift+T) — right-click for shell choice">+</button>
          <button id="restore" title="Restore a detached session (Ctrl+Shift+Z)">⟳</button>
          <button id="historybtn" title="Session history — transcripts of past sessions">◷</button>
          <button id="settingsbtn" title="Settings">⚙</button>
          <button id="win-min" class="win-ctl" title="Minimize">–</button>
          <button id="win-max" class="win-ctl" title="Maximize / restore">▢</button>
          <button id="win-close" class="win-ctl" title="Close window — sessions keep running">×</button>
          <div id="restore-menu" class="menu"></div>
          <div id="overflow-menu" class="menu"></div>
          <div id="hidden-menu" class="menu"></div>
        </div>
        <div id="panes"></div>
        <div id="settings-page">
          <div class="settings-inner">
            <div class="settings-h1">
              <span>Settings</span>
              <button id="settings-close" title="Close (Esc)">×</button>
            </div>
            <div id="settings-list"></div>
          </div>
        </div>
        <div id="history-page">
          <div class="settings-inner">
            <div class="settings-h1">
              <span>History</span>
              <button id="history-close" title="Close (Esc)">×</button>
            </div>
            <input id="history-search" type="text" placeholder="Search transcripts… (Enter)" />
            <div id="history-list"></div>
          </div>
        </div>
        <div id="history-viewer">
          <div id="history-viewer-bar">
            <button id="history-back">← history</button>
            <span id="history-viewer-title"></span>
          </div>
          <div id="history-term"></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

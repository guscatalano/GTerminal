<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GTerminal</title>
  </head>
  <body>
    <div id="app">
      <div id="sidebar">
        <div id="sidebar-title">Sessions</div>
        <div id="sidebar-list"></div>
        <button id="sidebar-new">+ new session</button>
      </div>
      <div id="main">
        <div id="tabbar-row">
          <button id="sidebtn" title="Toggle session sidebar (Ctrl+Shift+B)">☰</button>
          <div id="tabbar"></div>
          <button id="overflow" class="chip" hidden></button>
          <div id="hiddenbar"></div>
          <button id="newtab" title="New tab (Ctrl+Shift+T)">+</button>
          <button id="restore" title="Restore a detached session (Ctrl+Shift+Z)">⟳</button>
          <button id="themebtn" title="Theme">🎨</button>
          <div id="restore-menu" class="menu"></div>
          <div id="theme-menu" class="menu"></div>
          <div id="overflow-menu" class="menu"></div>
          <div id="hidden-menu" class="menu"></div>
        </div>
        <div id="panes"></div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

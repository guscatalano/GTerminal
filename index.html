<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GTerminal</title>
  </head>
  <body>
    <div id="app">
      <div id="sidebar">
        <div id="sidebar-title">Sessions</div>
        <div id="sidebar-list"></div>
        <div id="sidebar-legend">● open&ensp;◌ hidden&ensp;○ detached&ensp;⌛ closing</div>
        <button id="sidebar-new">+ new session</button>
      </div>
      <div id="main">
        <div id="tabbar-row">
          <button id="sidebtn" title="Toggle session sidebar (Ctrl+Shift+B)">☰</button>
          <div id="tabbar"></div>
          <button id="overflow" class="chip" hidden></button>
          <div id="hiddenbar"></div>
          <button id="newtab" title="New tab (Ctrl+Shift+T) — right-click for shell choice">+</button>
          <button id="restore" title="Restore a detached session (Ctrl+Shift+Z)">⟳</button>
          <button id="settingsbtn" title="Settings">⚙</button>
          <div id="restore-menu" class="menu"></div>
          <div id="overflow-menu" class="menu"></div>
          <div id="hidden-menu" class="menu"></div>
        </div>
        <div id="panes"></div>
        <div id="settings-page">
          <div class="settings-inner">
            <div class="settings-h1">
              <span>Settings</span>
              <button id="settings-close" title="Close (Esc)">×</button>
            </div>
            <div id="settings-list"></div>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

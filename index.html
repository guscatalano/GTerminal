<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GTerminal</title>
  </head>
  <body>
    <div id="app">
      <div id="sidebar">
        <div id="sidebar-title" data-tauri-drag-region>
          <span>Sessions</span>
          <button id="sidebar-collapse" title="Collapse sidebar (Ctrl+Shift+B)">⟨</button>
        </div>
        <div id="sidebar-resize" title="Drag to resize — double-click to collapse"></div>
        <div id="sidebar-list"></div>
        <div id="sidebar-legend">● open&ensp;◌ hidden&ensp;○ detached&ensp;⌛ closing</div>
        <button id="sidebar-new">+ new session</button>
      </div>
      <div id="main">
        <div id="tabbar-row" data-tauri-drag-region>
          <button id="sidebtn" title="Toggle session sidebar (Ctrl+Shift+B)">
            <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="1.75" y="2.75" width="12.5" height="10.5" rx="1.5"/><line x1="6" y1="2.75" x2="6" y2="13.25"/></svg>
          </button>
          <div id="tabbar" data-tauri-drag-region></div>
          <button id="overflow" class="chip" hidden></button>
          <div id="hiddenbar"></div>
          <button id="newtab" title="New tab (Ctrl+Shift+T) — right-click for templates and shells">
            <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><line x1="8" y1="3" x2="8" y2="13"/><line x1="3" y1="8" x2="13" y2="8"/></svg>
          </button>
          <button id="restore" title="Restore a detached session (Ctrl+Shift+Z)">
            <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M2.75 6.5 A 5.6 5.6 0 1 1 2.4 9.6"/><polyline points="2.75 3.2 2.75 6.5 6.05 6.5"/></svg>
          </button>
          <button id="historybtn" title="Session history — transcripts of past sessions">
            <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="8" r="5.75"/><polyline points="8 4.75 8 8 10.5 9.5"/></svg>
          </button>
          <button id="settingsbtn" title="Settings">
            <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><line x1="2.5" y1="4.5" x2="13.5" y2="4.5"/><line x1="2.5" y1="8" x2="13.5" y2="8"/><line x1="2.5" y1="11.5" x2="13.5" y2="11.5"/><circle cx="10.2" cy="4.5" r="1.9" fill="currentColor" stroke="none"/><circle cx="5.6" cy="8" r="1.9" fill="currentColor" stroke="none"/><circle cx="9.2" cy="11.5" r="1.9" fill="currentColor" stroke="none"/></svg>
          </button>
          <button id="zenbtn" title="Full screen (F11) — terminal only, everything else hidden">
            <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="2.5 5.5 2.5 2.5 5.5 2.5"/><polyline points="10.5 2.5 13.5 2.5 13.5 5.5"/><polyline points="13.5 10.5 13.5 13.5 10.5 13.5"/><polyline points="5.5 13.5 2.5 13.5 2.5 10.5"/></svg>
          </button>
          <div id="win-grip" data-tauri-drag-region title="Drag to move the window"></div>
          <button id="win-min" class="win-ctl" title="Minimize">
            <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"><line x1="3.5" y1="8" x2="12.5" y2="8"/></svg>
          </button>
          <button id="win-max" class="win-ctl" title="Maximize / restore">
            <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"><rect x="3.75" y="3.75" width="8.5" height="8.5" rx="1"/></svg>
          </button>
          <button id="win-close" class="win-ctl" title="Close window — sessions keep running">
            <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"><line x1="4" y1="4" x2="12" y2="12"/><line x1="12" y1="4" x2="4" y2="12"/></svg>
          </button>
          <div id="restore-menu" class="menu"></div>
          <div id="overflow-menu" class="menu"></div>
          <div id="hidden-menu" class="menu"></div>
        </div>
        <div id="panes"></div>
        <div id="settings-page">
          <div class="settings-inner">
            <div class="settings-h1">
              <span>Settings</span>
              <button id="settings-close" title="Close (Esc)">×</button>
            </div>
            <input id="settings-search" type="text" placeholder="Search settings…" />
            <div id="settings-list"></div>
          </div>
        </div>
        <div id="history-page">
          <div class="settings-inner">
            <div class="settings-h1">
              <span>History</span>
              <button id="history-close" title="Close (Esc)">×</button>
            </div>
            <input id="history-search" type="text" placeholder="Search transcripts… (Enter)" />
            <div id="history-list"></div>
          </div>
        </div>
        <div id="zen-pill" title="Exit full screen — drag to reposition">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="5.5 2.5 5.5 5.5 2.5 5.5"/><polyline points="13.5 5.5 10.5 5.5 10.5 2.5"/><polyline points="10.5 13.5 10.5 10.5 13.5 10.5"/><polyline points="2.5 10.5 5.5 10.5 5.5 13.5"/></svg>
        </div>
        <div id="history-viewer">
          <div id="history-viewer-bar">
            <button id="history-back">← history</button>
            <span id="history-viewer-title"></span>
          </div>
          <div id="history-term"></div>
        </div>
        <!-- Last in the column on purpose: the settings and history pages
             replace #panes, so a status bar placed before them rides up to
             the top whenever one of those is open. -->
        <div id="status-detail"></div>
        <div id="statusbar"></div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
